# Builds the Windows download on GitHub from this code. Release downloads only ever come from
# here (never from someone's own PC), so anyone can check where a download came from.
#
# - Pushing a version tag (e.g. v0.9.10-beta) builds it, signs the .exe once SignPath is set
#   up, records a signed attestation (this workflow built this zip from this commit), checks
#   that attestation itself, and makes a DRAFT release with the zip and its SHA-256. A person
#   reads it over and publishes it. A release that's already published is never changed from
#   here.
# - "Run workflow" (Actions tab) just builds, and leaves the zip on the run's page.
#
# The zip is kept on the run's page as it is (not wrapped in another zip, which GitHub does
# to artifacts unless told not to), so the SHA-256 shown there is the zip's own SHA-256: the
# same as SHA256SUMS.txt and the release page.
#
# Check a download:   gh attestation verify <the zip> --repo beanguri/Maple-Classic-Exp-Overlay
#
# Signing switches on once SignPath has accepted the project: add the secret
# SIGNPATH_API_TOKEN and the variable SIGNPATH_ORGANIZATION_ID (Settings > Secrets and
# variables > Actions). Until then that step is skipped and the build is unsigned.
#
# Actions are pinned to exact commits (a version tag can be moved; a commit can't).
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write             # the draft release (version tags only)
      id-token: write             # signing the attestation
      attestations: write
      artifact-metadata: write
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the program's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' maple_exp.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but maple_exp.py says VERSION = $version. Fix one, and tag again."
            exit 1
          fi
          # mcwo.app takes runs and reports only from the versions in server/src/released.js.
          if ! grep -qF "\"$version\"" server/src/released.js; then
            echo "::error::VERSION $version is missing from server/src/released.js: add it, deploy the site before Publish, and tag again."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"
      - name: Install the packages (exact files, each checked by its SHA-256)
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Install Tesseract OCR
        run: choco install tesseract --version 5.5.0.20241111 -y --no-progress
      - name: Tests
        run: |
          python tests/test_logic.py
          python tests/test_screen.py
          python tests/test_ocr.py
          python tests/test_report.py
          python tests/test_health.py
          python tests/test_v2.py
      - name: Build
        run: python build.py
      - name: Keep the unsigned build
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unsigned
          path: build/dist/Maple Classic Exp Overlay
      - name: Sign the .exe (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627  # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: maple-classic-exp-overlay
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Zip the signed build
        if: env.SIGNPATH_API_TOKEN != ''
        run: python build.py zip signed
      - name: SHA-256 of the download
        id: sum
        shell: bash
        run: |
          cd release
          sha256sum --text *.zip | tee SHA256SUMS.txt
          echo "zip=release/$(ls *.zip)" >> "$GITHUB_OUTPUT"
          { echo "### The download"; echo; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Record where the download came from (attestation)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ steps.sum.outputs.zip }}
      - name: Check the attestation (the build proves itself)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.sum.outputs.zip }}
        run: |
          for try in 1 2 3 4 5 6; do
            if gh attestation verify "$ZIP" --repo "$GITHUB_REPOSITORY" \
                 --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The attestation doesn't verify."
          exit 1
      - name: Keep the download on this run's page (the zip itself, not wrapped in another zip)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: ${{ steps.sum.outputs.zip }}
          archive: false
      - name: Keep the checksum on this run's page
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: release/SHA256SUMS.txt
          archive: false
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.sum.outputs.zip }}
        run: |
          name=$(basename "$ZIP")
          hash=$(sha256sum "$ZIP" | cut -d' ' -f1)
          title="Maple Classic Exp Overlay $(echo "$TAG" | sed -E 's/-beta$/ (beta)/')"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > notes.md <<'EOF'
          (Notes to come.)

          ---
          **Check this download**
          - SHA-256 of __NAME__: `__HASH__` (also in SHA256SUMS.txt). In PowerShell: `Get-FileHash .\__NAME__`
          - Built by GitHub from this tag, not on a PC. Check it with the GitHub CLI: `gh attestation verify __NAME__ --repo __REPO__`
          - The same file is on [the build's page](__RUN__), where GitHub shows the same SHA-256.
          EOF
          sed -i -e "s|__NAME__|$name|g" -e "s|__HASH__|$hash|g" -e "s|__REPO__|$GITHUB_REPOSITORY|g" -e "s|__RUN__|$run|g" notes.md
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "none" ]; then
            gh release create "$TAG" "$ZIP" release/SHA256SUMS.txt --draft --verify-tag --title "$title" --notes-file notes.md
          elif [ "$state" = "true" ]; then
            gh release upload "$TAG" "$ZIP" release/SHA256SUMS.txt --clobber
            if gh release view "$TAG" --json body --jq .body | grep -q '(Notes to come.)'; then
              gh release edit "$TAG" --notes-file notes.md
            else
              echo "::warning::The draft's notes were already written. If they show a SHA-256, update it to: $hash"
            fi
          else
            echo "::warning::$TAG is already published, so it's left as it is. The build is on this run's page."
            exit 0
          fi
          # What's on the draft must be exactly what was built.
          mkdir check
          gh release download "$TAG" --pattern "$name" --dir check
          (cd check && sha256sum --check ../release/SHA256SUMS.txt)

  macos:
    # The Mac downloads: a .dmg for Apple Silicon and one for Intel, made by build_macos.py with its own Tesseract
    # (built here from pinned sources for macOS 14 and up: Homebrew's needs the runner's own, much newer macOS),
    # then checked by check_macos.py with Homebrew moved aside. Read-only on purpose: this job installs and builds
    # things, so it can't write a release or sign an attestation (the release job does that, from these files).
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]     # Apple Silicon, Intel (pinned: macos-latest moves)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the packages (exact files, each checked by its SHA-256)
        run: python -m pip install --require-hashes -r requirements-build-mac.txt
      - name: Build Tesseract from pinned sources (for macOS 14 and up, nothing from Homebrew)
        run: python build_macos.py tesseract "$RUNNER_TEMP/tess"
      - name: Tests
        run: |
          export PATH="$RUNNER_TEMP/tess/bin:$PATH"
          python tests/test_logic.py
          python tests/test_ocr.py
          python tests/test_v2.py
      - name: Build
        env:
          TESSERACT_PREFIX: ${{ runner.temp }}/tess
        run: python build_macos.py
      - name: Move Homebrew aside (nothing may come from it now)
        run: |
          cellar="$(brew --cellar)"
          sudo mv "$cellar" "$cellar.hidden"
          echo "CELLAR=$cellar" >> "$GITHUB_ENV"
      - name: Check the build the way a player gets it
        run: python check_macos.py "build/macos/dist/Maple Classic Exp Overlay.app" release/*.dmg
      - name: Put Homebrew back
        if: always()
        run: if [ -n "$CELLAR" ] && [ -d "$CELLAR.hidden" ]; then sudo mv "$CELLAR.hidden" "$CELLAR"; fi
      - name: SHA-256 of the download
        id: sum
        shell: bash
        run: |
          cd release
          kind=$([ "$(uname -m)" = arm64 ] && echo AppleSilicon || echo Intel)
          shasum -a 256 *.dmg | tee "SHA256SUMS-macOS-$kind.txt"
          echo "dmg=release/$(ls *.dmg)" >> "$GITHUB_OUTPUT"
          echo "sums=release/SHA256SUMS-macOS-$kind.txt" >> "$GITHUB_OUTPUT"
          { echo "### The Mac download ($kind)"; echo; echo '```'; cat "SHA256SUMS-macOS-$kind.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the download on this run's page (the .dmg itself, not wrapped in a zip)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: ${{ steps.sum.outputs.dmg }}
          archive: false
      - name: Keep its checksum on this run's page
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: ${{ steps.sum.outputs.sums }}
          archive: false
      - name: Keep the check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mac-check-${{ matrix.runner }}
          path: |
            build/macos/check-*.md
            build/macos/screen-*.png
            build/macos/work/*/warn-*.txt
          if-no-files-found: warn
